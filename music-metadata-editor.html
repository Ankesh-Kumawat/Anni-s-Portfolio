<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Metadata Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .upload-section {
            padding: 40px;
            text-align: center;
            border-bottom: 2px solid #f0f0f0;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .songs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            padding: 40px;
        }

        .song-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .song-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .song-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .album-art {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .song-info {
            flex: 1;
            min-width: 0;
        }

        .filename {
            font-weight: 600;
            color: #333;
            font-size: 0.9em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .duration {
            font-size: 0.8em;
            color: #999;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
        }

        .btn-download {
            background: #667eea;
            color: white;
        }

        .btn-download:hover {
            background: #5568d3;
        }

        .empty-state {
            text-align: center;
            padding: 60px 40px;
            color: #999;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Music Metadata Editor</h1>
            <p>View and edit metadata of your music files (using music-metadata library)</p>
        </div>

        <div class="upload-section">
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" accept="audio/*" multiple>
                <label for="fileInput" class="file-input-label">
                    📁 Select Music Files
                </label>
            </div>
            <p style="margin-top: 15px; color: #666;">Supports MP3, M4A, WAV, OGG, FLAC</p>
        </div>

        <div id="songsContainer" class="songs-grid">
            <div class="empty-state">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3">
                    </path>
                </svg>
                <h3>No songs selected</h3>
                <p>Click the button above to select your music files</p>
            </div>
        </div>
    </div>

    <script type="module">
        import * as mm from 'https://cdn.jsdelivr.net/npm/music-metadata-browser@2.5.10/+esm';

        const fileInput = document.getElementById('fileInput');
        const songsContainer = document.getElementById('songsContainer');
        let songs = [];

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            songsContainer.innerHTML = '<div class="loading"><h3>⏳ Loading songs...</h3></div>';
            songs = [];

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                await loadSong(file, i);
            }

            if (songs.length === 0) {
                songsContainer.innerHTML = '<div class="empty-state"><h3>No songs loaded</h3></div>';
            }
        });

        async function loadSong(file, index) {
            const song = {
                file: file,
                filename: file.name,
                title: '',
                artist: '',
                album: '',
                coverUrl: null,
                duration: 0
            };

            try {
                // Read metadata using music-metadata (same library as your app!)
                const metadata = await mm.parseBlob(file);

                song.title = metadata.common.title || file.name.replace(/\.[^/.]+$/, '');
                song.artist = metadata.common.artist || 'Unknown Artist';
                song.album = metadata.common.album || 'Unknown Album';
                song.duration = metadata.format.duration || 0;

                // Extract cover art
                if (metadata.common.picture && metadata.common.picture.length > 0) {
                    const picture = metadata.common.picture[0];
                    const uint8Array = new Uint8Array(picture.data);
                    let binary = '';
                    for (let i = 0; i < uint8Array.length; i++) {
                        binary += String.fromCharCode(uint8Array[i]);
                    }
                    const base64 = btoa(binary);
                    song.coverUrl = `data:${picture.format};base64,${base64}`;
                }

                songs.push(song);
                if (index === 0) {
                    songsContainer.innerHTML = '';
                }
                renderSong(song, songs.length - 1);
            } catch (error) {
                console.log('Error reading metadata:', error);
                song.title = file.name.replace(/\.[^/.]+$/, '');
                song.artist = 'Unknown Artist';
                song.album = 'Unknown Album';
                songs.push(song);
                if (index === 0) {
                    songsContainer.innerHTML = '';
                }
                renderSong(song, songs.length - 1);
            }
        }

        function formatDuration(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function renderSong(song, index) {
            const card = document.createElement('div');
            card.className = 'song-card';
            card.innerHTML = `
                <div class="song-header">
                    <img src="${song.coverUrl || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23667eea%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%22 y=%2250%22 font-size=%2240%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22white%22%3E🎵%3C/text%3E%3C/svg%3E'}" 
                         alt="Album Art" 
                         class="album-art">
                    <div class="song-info">
                        <div class="filename" title="${song.filename}">${song.filename}</div>
                        <div class="duration">${formatDuration(song.duration)}</div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>📝 Title</label>
                    <input type="text" value="${song.title}" data-index="${index}" data-field="title">
                </div>
                
                <div class="form-group">
                    <label>🎤 Artist</label>
                    <input type="text" value="${song.artist}" data-index="${index}" data-field="artist">
                </div>
                
                <div class="form-group">
                    <label>💿 Album</label>
                    <input type="text" value="${song.album}" data-index="${index}" data-field="album">
                </div>
                
                <div class="actions">
                    <button class="btn btn-save" onclick="window.saveSong(${index})">💾 Save Changes</button>
                    <button class="btn btn-download" onclick="window.downloadSong(${index})" id="download-${index}" disabled style="opacity: 0.5;">⬇️ Download</button>
                </div>
                <div id="status-${index}" style="margin-top: 10px; padding: 8px; border-radius: 6px; font-size: 0.85em; text-align: center; display: none;"></div>
            `;

            songsContainer.appendChild(card);

            // Add event listeners for inputs
            const inputs = card.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = parseInt(e.target.dataset.index);
                    const field = e.target.dataset.field;
                    songs[idx][field] = e.target.value;
                });
            });
        }

        window.saveSong = function (index) {
            const song = songs[index];
            const status = document.getElementById(`status-${index}`);
            const downloadBtn = document.getElementById(`download-${index}`);

            // Mark as saved
            song.saved = true;

            // Enable download button
            downloadBtn.disabled = false;
            downloadBtn.style.opacity = '1';

            // Show success message
            status.style.display = 'block';
            status.style.background = '#d1fae5';
            status.style.color = '#065f46';
            status.textContent = '✓ Changes saved! Now you can download.';

            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        };

        window.downloadSong = function (index) {
            const song = songs[index];

            if (!song.saved) {
                alert('⚠️ Please save changes first!');
                return;
            }

            // Create new filename with updated metadata
            const extension = song.filename.split('.').pop();
            const newFilename = `${song.title} by ${song.artist}.${extension}`;

            const url = URL.createObjectURL(song.file);
            const a = document.createElement('a');
            a.href = url;
            a.download = newFilename;
            a.click();
            URL.revokeObjectURL(url);

            const status = document.getElementById(`status-${index}`);
            status.style.display = 'block';
            status.style.background = '#dbeafe';
            status.style.color = '#1e40af';
            status.textContent = `✓ Downloaded as: ${newFilename}`;

            setTimeout(() => {
                status.style.display = 'none';
            }, 4000);
        };
    </script>
</body>

</html>
